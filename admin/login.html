<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — W&amp;N Wedding Desk</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233E1730%22/><text x=%2250%22 y=%2266%22 font-family=%22Georgia,%20serif%22 font-size=%2240%22 fill=%22%23E8D9BE%22 text-anchor=%22middle%22>N%26W</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#FBF7F0; --plum:#3E1730; --plum-2:#5A2444; --gold:#B08A46; --border:#E4D5BE; --surface:#FFFDF9; --error:#A73E3E; --error-bg:#F6E3E1; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ivory); font-family:'Jost',sans-serif; font-weight:300; color:#3A2430; padding:20px; }
  .card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:38px 32px; box-shadow:0 18px 44px -22px rgba(62,23,48,.35); }
  h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.7rem; color:var(--plum); margin:0 0 4px; text-align:center; }
  p.sub{ text-align:center; font-size:.82rem; color:#8B7A6E; margin:0 0 26px; }
  label{ display:block; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--plum-2); margin-bottom:8px; }
  input{ width:100%; border:1px solid var(--border); background:var(--ivory); padding:12px 14px; font-size:.9rem; border-radius:6px; font-family:inherit; color:#3A2430; }
  input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  button{ width:100%; margin-top:18px; background:var(--plum); color:#fff; border:none; padding:13px; border-radius:6px; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; font-family:inherit; }
  button:hover{ background:var(--plum-2); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .error{ margin-top:14px; padding:10px 12px; background:var(--error-bg); color:var(--error); border-radius:6px; font-size:.82rem; display:none; }
  .error.show{ display:block; }
  .field{ margin-bottom:16px; }
  .hint{ font-size:.74rem; color:#8B7A6E; margin-top:6px; }
</style>
</head>
<body>
<div class="card">
  <h1>Nyasha &amp; Watson</h1>
  <p class="sub">Wedding Management Portal</p>
  <form id="loginForm">
    <div class="field" id="emailField">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username">
      <p class="hint">Leave empty to use the main portal password.</p>
    </div>
    <div class="field" style="margin-bottom:0;">
      <label for="password" id="pwLabel">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <p class="hint" id="pwHint" hidden>At least 8 characters, with letters and a number.</p>
    </div>
    <button type="submit" id="submitBtn">Sign In</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var invite = params.get('invite') || '';
  var form = document.getElementById('loginForm');
  // invitation / password-reset link: greet them and ask for a new password
  if (invite) {
    document.getElementById('emailField').hidden = true;
    document.getElementById('pwLabel').textContent = 'Choose a password';
    document.getElementById('password').setAttribute('autocomplete', 'new-password');
    document.getElementById('pwHint').hidden = false;
    document.getElementById('submitBtn').textContent = 'Set Password & Sign In';
    fetch('/api/admin/login?invite=' + encodeURIComponent(invite)).then(function (r) { return r.json(); }).then(function (d) {
      var sub = document.querySelector('p.sub');
      if (d.ok) sub.textContent = (d.reset ? 'Set a new password, ' : 'Welcome, ') + d.name + (d.reset ? '' : ' — choose your password') + ' (' + d.email + ')';
      else { sub.textContent = 'This link has expired or was already used. Ask the owner for a new one.'; document.getElementById('submitBtn').disabled = true; }
    });
  }
  (invite ? document.getElementById('password') : document.getElementById('email')).focus();
  var btn = document.getElementById('submitBtn');
  var err = document.getElementById('errorMsg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Signing In…';
    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(invite ? { invite: invite, password: document.getElementById('password').value } : { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value })
    }).then(function (res) {
      if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || 'Sign in failed'); });
      return res.json();
    }).then(function () {
      var next = params.get('next') || '';
      location.href = /^\/admin\//.test(next) ? next : '/admin/index.html';
    }).catch(function (e) {
      err.textContent = e.message || 'Incorrect password';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = invite ? 'Set Password & Sign In' : 'Sign In';
    });
  });
</script>
</body>
</html>
